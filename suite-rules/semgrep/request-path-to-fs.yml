# Generated by _generate.py from one shared source definition; edit that file, not this one.
rules:
  - id: request-path-to-fs
    mode: taint
    options:
      taint_assume_safe_functions: true
      taint_assume_safe_indexes: true
    languages: [python]
    severity: ERROR
    message: "Request input reaches a filesystem path. Use argus_cortex.fs.safe_join(root, value), or safe_name for a single id, which returns the resolved path under root or raises PathRefused."
    metadata:
      class: "path_traversal"
      catalogue: argus-ci/suite-rules
    paths:
      exclude:
        - "tests/"
        - "test_*.py"
        - "*_test.py"
        - "conftest.py"
    pattern-sources:
      # Parameters of a web route handler (FastAPI / Starlette / Flask style decorators),
      # except injected dependencies (Depends) and parameters typed as numbers, bools, UUIDs or dates.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  def $FUNC(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  async def $FUNC(..., $PARAM, ...):
                    ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route|route|websocket)$
          - pattern-not-inside: |
              def $FUNC(..., $PARAM = Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$T, Depends(...)], ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$T, Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Request, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Request, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: BackgroundTasks, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: BackgroundTasks, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Response, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Response, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: int = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: int = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: float = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: float = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: bool, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: bool, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: bool = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: bool = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: UUID, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: UUID, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: UUID = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: UUID = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: uuid.UUID, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: uuid.UUID, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: uuid.UUID = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: uuid.UUID = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: datetime, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: datetime, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: datetime = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: datetime = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: date, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: date, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: date = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: date = $D, ...):
                ...
          - focus-metavariable: $PARAM
      # Request objects (Flask, Starlette)
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.files
          - pattern: request.query_params
          - pattern: request.path_params
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.url
          - pattern: await request.json()
          - pattern: await request.form()
          - pattern: await request.body()
          - pattern: request.stream()
          - pattern: request.get_json(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: os.path.basename(...)
      - pattern: Path(...).name
      - pattern: PurePath(...).name
      # A validator that raises on a bad value clears it from then on.
      - by-side-effect: true
        patterns:
          - pattern: $F(..., $X, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(.*\.)?(validate_\w+|ensure_(safe|valid|allowed|within|under)\w*|require_(safe|valid|allowed|within|under)\w*|safe_join|safe_name|safe_path|resolve_under\w*|\w+_or_404)$
          - focus-metavariable: $X
      # relative_to raises ValueError when the resolved path is outside the root.
      - by-side-effect: true
        patterns:
          - pattern: $X.resolve(...).relative_to(...)
          - focus-metavariable: $X
      # A containment guard: `if not X.resolve().is_relative_to(root): raise`, or the parent / commonpath form.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... not $X.resolve(...).is_relative_to(...) ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... not $X.resolve(...).is_relative_to(...) ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... not $X.resolve(...).is_relative_to(...) ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... not $X.resolve(...).is_relative_to(...) ...>:
                      ...
                      return ...
                  ...
              - pattern-inside: |
                  if <... not $X.is_relative_to(...) ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... not $X.is_relative_to(...) ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... not $X.is_relative_to(...) ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... not $X.is_relative_to(...) ...>:
                      ...
                      return ...
                  ...
              - pattern-inside: |
                  if <... $X.resolve(...).parent != $B ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... $X.resolve(...).parent != $B ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... $X.resolve(...).parent != $B ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... $X.resolve(...).parent != $B ...>:
                      ...
                      return ...
                  ...
              - pattern-inside: |
                  if <... $B != $X.resolve(...).parent ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... $B != $X.resolve(...).parent ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... $B != $X.resolve(...).parent ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... $B != $X.resolve(...).parent ...>:
                      ...
                      return ...
                  ...
              - pattern-inside: |
                  if <... os.path.commonpath([..., $X, ...]) != $B ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... os.path.commonpath([..., $X, ...]) != $B ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... os.path.commonpath([..., $X, ...]) != $B ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... os.path.commonpath([..., $X, ...]) != $B ...>:
                      ...
                      return ...
                  ...
              - pattern-inside: |
                  if <... $B != os.path.commonpath([..., $X, ...]) ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... $B != os.path.commonpath([..., $X, ...]) ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... $B != os.path.commonpath([..., $X, ...]) ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... $B != os.path.commonpath([..., $X, ...]) ...>:
                      ...
                      return ...
                  ...
          - pattern: $X
      # A predicate validator as a rejecting guard: `if not is_safe(X): abort(400)`.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... not $F(..., $X, ...) ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... not $F(..., $X, ...) ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... not $F(..., $X, ...) ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... not $F(..., $X, ...) ...>:
                      ...
                      return ...
                  ...
          - metavariable-regex:
              metavariable: $F
              regex: ^(.*\.)?(is_\w*(safe|valid|allowed|permitted|within|under_root)\w*|\w+_is_(safe|valid|allowed)|allowed_\w+|\w+_(allowed|permitted))$
          - pattern: $X
      # An allow-list guard: `if X not in ALLOWED: raise`. A membership test that rejects nothing
      # (`if url in cache: ...`, `if name not in seen: seen.add(name)`) is not one.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if <... $X not in $C ...>:
                      ...
                      raise ...
                  ...
              - pattern-inside: |
                  if <... $X not in $C ...>:
                      ...
                      abort(...)
                  ...
              - pattern-inside: |
                  if <... $X not in $C ...>:
                      ...
                      flask.abort(...)
                  ...
              - pattern-inside: |
                  if <... $X not in $C ...>:
                      ...
                      return ...
                  ...
          - pattern: $X
      # The body of `if X in ALLOWED:`, but not when that if has an else (semgrep's pattern-inside would cover it).
      - patterns:
          - pattern-inside: |
              if <... $X in $C ...>:
                  ...
          - pattern-not-inside: |
              if <... $X in $C ...>:
                  ...
              else:
                  ...
          - pattern: $X
    pattern-sinks:
      # Where the path is used, not where it is built: code often builds a path and checks it
      # before touching the filesystem.
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: io.open($P, ...)
              - pattern: open(Path($P), ...)
              - pattern: os.open($P, ...)
              - pattern: os.remove($P)
              - pattern: os.unlink($P)
              - pattern: shutil.$FN($P, ...)
              - pattern: shutil.$FN($A, $P, ...)
              - pattern: FileResponse($P, ...)
              - pattern: send_file($P, ...)
              - pattern: send_from_directory($D, $P, ...)
              - pattern: Path($P).$M(...)
              - patterns:
                  - pattern: $P.$M(...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(open|read_text|read_bytes|write_text|write_bytes|unlink|rmdir|mkdir|rename|replace|touch|symlink_to|iterdir|glob|rglob)$
          - focus-metavariable: $P
