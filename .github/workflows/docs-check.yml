# Keeps a package's published docs (README.md + docs/**/*.md: what PyPI and the
# demo UIs import) correct and clean at every commit:
#   1. cli-reference: regenerates the Typer CLI reference and fails if the
#      committed file differs. Skipped when cli-module is empty (no CLI).
#   2. hygiene: fails on private IPs, home/server paths, non-noreply emails and
#      terms on an optional private denylist (a secret, never committed).
name: docs-check

on:
  workflow_call:
    inputs:
      cli-module:
        description: 'Python module holding the Typer app (e.g. "argus_curator.cli"); empty skips the CLI reference.'
        type: string
        default: ""
      cli-name:
        description: 'Command name shown in the reference (e.g. "argus-curator"). Required with cli-module.'
        type: string
        default: ""
      cli-output:
        description: "Committed path of the generated CLI reference."
        type: string
        default: "docs/cli.md"
      install-extras:
        description: 'Extras needed to import the CLI module (e.g. "cli"); empty installs the bare package.'
        type: string
        default: ""
      python-version:
        description: "Python used to import the CLI."
        type: string
        default: "3.12"
      allow-pattern:
        description: "Optional regex (Python syntax); a finding is ignored when its line matches it. For known false positives."
        type: string
        default: ""
    secrets:
      denylist:
        description: "Optional newline-separated private terms (case-insensitive) that must not appear in published docs."
        required: false

permissions:
  contents: read

jobs:
  cli-reference:
    if: inputs.cli-module != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the dev version from git history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        env:
          PY: ${{ inputs.python-version }}
          EXTRAS: ${{ inputs.install-extras }}
        run: |
          uv venv --python "$PY"
          if [ -n "$EXTRAS" ]; then uv pip install -e ".[${EXTRAS}]"; else uv pip install -e .; fi
      - name: Regenerate and compare
        env:
          CLI_MODULE: ${{ inputs.cli-module }}
          CLI_NAME: ${{ inputs.cli-name }}
          OUT: ${{ inputs.cli-output }}
        run: |
          set -eu
          if [ -z "$CLI_NAME" ]; then
            echo "::error::docs-check: cli-name is required when cli-module is set."
            exit 1
          fi
          mkdir -p "$(dirname "$OUT")"
          uv run --no-sync python -m typer "$CLI_MODULE" utils docs --name "$CLI_NAME" --output "$OUT"
          if [ -n "$(git status --porcelain -- "$OUT")" ]; then
            git --no-pager diff -- "$OUT" || true
            echo "::error file=${OUT}::${OUT} does not match the CLI. Regenerate it and commit: python -m typer ${CLI_MODULE} utils docs --name ${CLI_NAME} --output ${OUT}"
            exit 1
          fi
          echo "${OUT} matches the CLI."

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan published docs
        env:
          DENYLIST: ${{ secrets.denylist }}
          ALLOW: ${{ inputs.allow-pattern }}
        run: |
          set -eu
          # Mask each denylist term so a hit never echoes the term into a public log.
          printf '%s\n' "$DENYLIST" | while IFS= read -r t; do
            t=$(printf '%s' "$t" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$t" ]; then echo "::add-mask::$t"; fi
          done
          git ls-files -z -- README.md ':(glob)docs/**/*.md' > "$RUNNER_TEMP/docs.lst"
          python3 - "$RUNNER_TEMP/docs.lst" <<'PY'
          import os, re, sys

          files = [f for f in open(sys.argv[1], "rb").read().decode().split("\0") if f]
          allow = re.compile(os.environ["ALLOW"]) if os.environ.get("ALLOW") else None
          oct_ = r"(?:25[0-5]|2[0-4]\d|1?\d?\d)"
          checks = [
              ("private or link-local IP", re.compile(
                  rf"(?<![\d.])(?:10\.{oct_}|172\.(?:1[6-9]|2\d|3[01])|192\.168|169\.254)"
                  rf"\.{oct_}\.{oct_}(?!\d|\.\d)"
              ), None),
              ("home or server path", re.compile(r"(?:/home|/Users)/[A-Za-z0-9._-]+|/srv/[A-Za-z0-9._-]+"), None),
              ("email address", re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"),
               # noreply addresses, git-over-SSH remotes and RFC 2606 placeholder domains pass.
               re.compile(r"noreply|^git@|@example\.(?:com|org|net)$", re.I)),
          ]
          terms = [t.strip() for t in os.environ.get("DENYLIST", "").splitlines() if t.strip()]
          if terms:
              checks.append(("private term", re.compile("|".join(map(re.escape, terms)), re.I), None))

          hits = 0
          for path in files:
              try:
                  lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              except OSError:
                  continue
              for n, line in enumerate(lines, 1):
                  if allow and allow.search(line):
                      continue
                  for label, rx, ok in checks:
                      for m in rx.finditer(line):
                          if ok and ok.search(m.group(0)):
                              continue
                          shown = "(denylisted)" if label == "private term" else m.group(0)
                          print(f"::error file={path},line={n},col={m.start() + 1}::{label}: {shown}"
                                " (use a placeholder such as <GPU_HOST>)")
                          hits += 1
          print(f"Scanned {len(files)} file(s): {hits} finding(s).")
          sys.exit(1 if hits else 0)
          PY
