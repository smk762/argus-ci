# Generated by _generate.py from one shared source definition; edit that file, not this one.
rules:
  - id: request-url-outbound
    mode: taint
    options:
      taint_assume_safe_functions: true
      taint_assume_safe_indexes: true
    languages: [python]
    severity: ERROR
    message: "Request input becomes the URL of an outbound call (SSRF). Fetch it with argus_cortex.net.fetch / afetch, which checks every resolved address, pins the connection and re-checks redirects; pass allow_hosts for internal services."
    metadata:
      class: "ssrf"
      catalogue: argus-ci/suite-rules
    paths:
      exclude:
        - "tests/"
        - "test_*.py"
        - "*_test.py"
        - "conftest.py"
    pattern-sources:
      # Parameters of a web route handler (FastAPI / Starlette / Flask style decorators),
      # except injected dependencies (Depends) and parameters typed as numbers, bools, UUIDs or dates.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  def $FUNC(..., $PARAM, ...):
                    ...
              - pattern-inside: |
                  @$APP.$METHOD(...)
                  async def $FUNC(..., $PARAM, ...):
                    ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|api_route|route|websocket)$
          - pattern-not-inside: |
              def $FUNC(..., $PARAM = Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: $T = Depends(...), ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$T, Depends(...)], ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$T, Depends(...)], ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Request, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Request, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: BackgroundTasks, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: BackgroundTasks, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Response, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Response, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: int, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: int = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: int = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: float, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: float = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: float = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: bool, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: bool, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: bool = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: bool = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: UUID, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: UUID, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: UUID = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: UUID = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: uuid.UUID, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: uuid.UUID, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: uuid.UUID = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: uuid.UUID = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: datetime, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: datetime, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: datetime = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: datetime = $D, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: date, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: date, ...):
                ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: date = $D, ...):
                ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: date = $D, ...):
                ...
          - focus-metavariable: $PARAM
      # Request objects (Flask, Starlette)
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.files
          - pattern: request.query_params
          - pattern: request.path_params
          - pattern: request.headers
          - pattern: request.cookies
          - pattern: request.url
          - pattern: await request.json()
          - pattern: await request.form()
          - pattern: await request.body()
          - pattern: request.stream()
          - pattern: request.get_json(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: os.path.basename(...)
      - pattern: Path(...).name
      - pattern: PurePath(...).name
      # A validation call, an allow-list membership test or a containment check clears the value
      # it checks from then on, whether or not it is used as the condition of an if.
      - by-side-effect: true
        patterns:
          - pattern: $F(..., $X, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(safe|secure|sanitiz|validat|allow|within|under_root|check|require|match|or_404|resolve_under).*
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X in $C
              - pattern: $X not in $C
          - focus-metavariable: $X
      # Resolving a path is how code checks containment (is_relative_to, parent ==, commonpath).
      - by-side-effect: true
        patterns:
          - pattern: $X.resolve(...)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: os.path.commonpath([..., $X, ...])
          - focus-metavariable: $X
      # A guard that rejects early: `if <... X.resolve() ... or a validator of X ...>: raise`.
      # (semgrep doesn't carry side effects out of a short-circuit `or` chain, so say it directly.)
      - patterns:
          - pattern-inside: |
              if <... $X.resolve() ...>:
                  raise ...
              ...
          - pattern: $X
    pattern-sinks:
      # Only when the request value is (or starts) the URL: a fixed base URL with a request value
      # appended later can't move the host, so f-strings and concatenations are not sinks.
      - patterns:
          - pattern-either:
              - pattern: requests.$M($U, ...)
              - pattern: requests.$M(url=$U, ...)
              - pattern: httpx.$M($U, ...)
              - pattern: httpx.$M(url=$U, ...)
              - pattern: urllib.request.urlopen($U, ...)
              - pattern: urlopen($U, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $C.$M($U, ...)
                      - pattern: $C.$M(url=$U, ...)
                  - metavariable-regex:
                      metavariable: $C
                      regex: (?i).*(client|session|http).*
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|patch|delete|head|options|request|stream)$
          - pattern-not: $X.$M(f"...", ...)
          - pattern-not: $X.$M("..." + $Y, ...)
          - pattern-not: $X.$M($A + $B, ...)
          - pattern-not: $X.$M("...".format(...), ...)
          - focus-metavariable: $U
