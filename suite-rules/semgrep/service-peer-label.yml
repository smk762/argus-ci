# Two rules. `service-peer-label` is the catalogue rule. `service-peer-labelled` is its helper: it reports the
# services that do carry the label, so check.py can drop a hit on an overlay file's entry (compose.build.yaml,
# compose.gpu.yaml) for a service that the base file beside it labels. check.py never reports the helper's matches.
# semgrep expands a YAML alias where it is used, so labels held in a merged anchor (`<<: *service`) are seen.
rules:
  - id: service-peer-label
    languages: [yaml]
    severity: WARNING
    message: >-
      This compose service has no argus.peer label, so the suite directory (argus-iris) cannot list it. Label an
      Argus service with the name its callers ask for (labels: argus.peer, plus argus.service, argus.health and
      argus.port; see argus_cortex.service). If the container is not a peer (a third-party image, a one-shot CLI or
      test container, a trainer, a UI), say so on the service's own line:
      `name:  # nosemgrep: service-peer-label  <reason>`.
    metadata:
      class: unhandled_error
      catalogue: argus-ci/suite-rules
    paths:
      include:
        - "*compose*.yaml"
        - "*compose*.yml"
      # A workflow's `jobs.<id>.services` is not a compose file, whatever the workflow is called.
      exclude:
        - ".github/"
    patterns:
      # A direct child of `services:` that says what it runs: an image, a build, or a merged anchor. An overlay
      # entry that only adjusts a service defined in another file has none of the three.
      - pattern-inside: |
          services:
            ...
            $SVC:
              ...
            ...
      - pattern: |
          $SVC:
            ...
            $KEY: $VALUE
            ...
      - metavariable-regex:
          metavariable: $KEY
          regex: ^(image|build|<<)$
      - pattern-not: |
          $SVC:
            ...
            labels:
              ...
              argus.peer: $PEER
              ...
            ...
      - pattern-not:
          patterns:
            - pattern: |
                $SVC:
                  ...
                  labels:
                    - ...
                    - $LABEL
                    - ...
                  ...
            - metavariable-regex:
                metavariable: $LABEL
                regex: ^["']?argus\.peer=.+
      - pattern-not: |
          $SVC:
            ...
            <<:
              ...
              labels:
                ...
                argus.peer: $PEER
                ...
              ...
            ...
      - pattern-not:
          patterns:
            - pattern: |
                $SVC:
                  ...
                  <<:
                    ...
                    labels:
                      - ...
                      - $LABEL
                      - ...
                    ...
                  ...
            - metavariable-regex:
                metavariable: $LABEL
                regex: ^["']?argus\.peer=.+
      - focus-metavariable: $SVC

  - id: service-peer-labelled
    languages: [yaml]
    severity: INFO
    message: >-
      Helper for service-peer-label: this service carries argus.peer. Not a finding.
    metadata:
      class: unhandled_error
      catalogue: argus-ci/suite-rules
    paths:
      include:
        - "*compose*.yaml"
        - "*compose*.yml"
      # A workflow's `jobs.<id>.services` is not a compose file, whatever the workflow is called.
      exclude:
        - ".github/"
    patterns:
      - pattern-inside: |
          services:
            ...
            $SVC:
              ...
            ...
      - pattern-either:
          - pattern: |
              $SVC:
                ...
                labels:
                  ...
                  argus.peer: $PEER
                  ...
                ...
          - patterns:
              - pattern: |
                  $SVC:
                    ...
                    labels:
                      - ...
                      - $LABEL
                      - ...
                    ...
              - metavariable-regex:
                  metavariable: $LABEL
                  regex: ^["']?argus\.peer=.+
          - pattern: |
              $SVC:
                ...
                <<:
                  ...
                  labels:
                    ...
                    argus.peer: $PEER
                    ...
                  ...
                ...
          - patterns:
              - pattern: |
                  $SVC:
                    ...
                    <<:
                      ...
                      labels:
                        - ...
                        - $LABEL
                        - ...
                      ...
                    ...
              - metavariable-regex:
                  metavariable: $LABEL
                  regex: ^["']?argus\.peer=.+
      - focus-metavariable: $SVC
